<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24 July</title>

    <style>
        :root{
            --bg: #A973A2;
            --fg: #EFF8FE;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .area {
            position: relative;
            width: 400px;
            height: 300px;
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
            flex: none
        }

        .area p,
        .area p:before {
            position: absolute;
            background: var(--fg);
        }

        .area p {
            left: 70px;
            top: 70px;
            width: 60px;
            height: 40px;
            box-shadow: 200px 0, 100px 120px
        }

        .area p:before {
            content: "";
            left: 50px;
            top: 0;
            width: 10px;
            height: 160px;
            box-shadow: 50px 0, 150px 0
        }
    </style>
</head>

<body>
    <div class="area">
        <p></p>
    </div>

    <a class="source" href="https://cssbattle.dev/play/YY6aMJfEYqKa166XP3rZ" target="_blank" rel="noopener">Task source</a>
</body>
</html>
