<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27 Jul</title>

    <style>
        :root {
            --bg: #3450AE;
            --fg: #22D16A;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .area {
            position: relative;
            width: 400px;
            height: 300px;
            background: var(--bg);
            overflow: hidden;
            flex: none
        }

        .area i {
            position: absolute;
            background: var(--fg);
            font-style: normal;
        }

        .area p {
            margin: 0;
            position: absolute;
            left: 60px;
            top: 80px;
            width: 20px;
            height: 20px;
            background: var(--fg);
            box-shadow:
                30px 0 var(--fg), 60px 0 var(--fg), 90px 0 var(--fg),
                30px 40px var(--fg), 60px 40px var(--fg), 90px 40px var(--fg),
                60px 80px var(--fg), 90px 80px var(--fg),
                90px 120px var(--fg);
        }

        .r1 {
            left: 190px;
            top: 80px;
            width: 150px;
            height: 20px
        }

        .r2 {
            left: 190px;
            top: 120px;
            width: 130px;
            height: 20px
        }

        .r3 {
            left: 190px;
            top: 160px;
            width: 110px;
            height: 20px
        }

        .r4 {
            left: 190px;
            top: 200px;
            width: 90px;
            height: 20px
        }
    </style>
</head>

<body>
    <div class="area">
        <p></p>
        <i class="r1"></i>
        <i class="r2"></i>
        <i class="r3"></i>
        <i class="r4"></i>
    </div>

    <a class="source" href="https://cssbattle.dev/play/9tg5HEQqGWBN3Apa88HN" target="_blank" rel="noopener">Task source</a>
</body>

</html
