<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style/style.css">

  <title>Frontend Mentor | Hotel booking confirmation page</title>
</head>

<body>

  <!-- Page: Sidebar + main content side by side -->
  <div class="page">

    <!-- ===================== Sidebar ===================== -->
    <aside class="sidebar">

      <!-- Logo -->
      <div class="sidebar__brand">
        <a href="#" class="logo">
          <img src="./assets/images/logo.svg" alt="Maison Soleil">
        </a>

        <!-- Toggle menu (mobile only) -->
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false"
          aria-controls="sidebar-nav">
          <img src="./assets/images/icon-menu.svg" alt="" class="menu-toggle__icon menu-toggle__icon--open">
          <img src="./assets/images/icon-close.svg" alt="" class="menu-toggle__icon menu-toggle__icon--close">
        </button>
      </div>

      <!-- Primary navigation -->
      <nav class="nav" id="sidebar-nav">
        <ul class="nav__list">
          <li>
            <a href="#" class="nav__link nav__link--active" aria-current="page">
              <img src="./assets/images/icon-bed.svg" alt="" class="nav__icon">
              <span class="nav__text">Your stay</span>
              <span class="nav__badge">1</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav__link">
              <img src="./assets/images/icon-house.svg" alt="" class="nav__icon">
              <span class="nav__text">The house</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav__link">
              <img src="./assets/images/icon-pin.svg" alt="" class="nav__icon">
              <span class="nav__text">Around town</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav__link">
              <img src="./assets/images/icon-breakfast-outline.svg" alt="" class="nav__icon">
              <span class="nav__text">Breakfast</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav__link">
              <img src="./assets/images/icon-mail.svg" alt="" class="nav__icon">
              <span class="nav__text">Messages</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Local weather card -->
      <div class="weather">
        <img src="./assets/images/icon-weather.svg" alt="" class="weather__icon">
        <p class="weather__label">Today in Cassis</p>
        <p class="weather__temp">27&deg;</p>
        <p class="weather__desc">Sunny &middot; light breeze</p>
      </div>

      <!-- Sidebar footer -->
      <footer class="sidebar__footer">
        <p class="sidebar__footer-line">Est. 1987</p>
        <address class="sidebar__footer-line">Maison Soleil &middot; 12 Rue des Oliviers &middot; Cassis</address>
        <p class="sidebar__footer-line">&copy; 2026 Maison Soleil</p>
      </footer>

    </aside>

    <!-- ===================== Main content ===================== -->
    <main class="main">

      <!-- Header -->
      <header class="main-header">
        <div class="main-header__left">
          <p class="main-header__eyebrow">Booking &middot; Confirmed</p>
          <h1 class="main-header__title">Bienvenue, <em>Lucia.</em></h1>
        </div>
        <div class="main-header__actions">
          <button type="button" class="btn btn--outline">Print receipt</button>
          <button type="button" class="btn btn--dark">Add to calendar</button>
        </div>
      </header>

    </main>

  </div>

  <script src="./js/script.js"></script>
</body>

</html>
